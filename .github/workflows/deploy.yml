name: Deploy to Raspberry Pi
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      COMPOSE_PROJECT_NAME: netdrops
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          docker compose up -d --build                                                               
          docker image prune -f

